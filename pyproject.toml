[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantum-inspire-starter"
version = "0.1.0"
description = "A beginner-friendly guide and Python helpers for running quantum circuits on Quantum Inspire"
readme = "README.md"
requires-python = ">=3.10, <3.14"
authors = [
    { name = "Neilson Ramalho" }
]
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "qiskit>=2.0.0,<2.4.0",
    "qiskit-quantuminspire>=0.18.2",
    "quantuminspire>=4.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
visuals = [
    "matplotlib>=3.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["qi_starter"]
